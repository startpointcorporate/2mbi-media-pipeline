name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "10"

jobs:
  typescript-build:
    name: TypeScript — Build & Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r test -- --reporter=verbose
        env:
          # Integration tests are skipped when these are not set
          REDIS_URL: ""

  typescript-integration:
    name: TypeScript — Integration
    runs-on: ubuntu-latest
    needs: typescript-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: media_pipeline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d media_pipeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migration
        run: npx tsx database/migrations/run.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/media_pipeline

      - name: Integration tests
        run: pnpm --filter @2mbi/test-support test -- --reporter=verbose
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/media_pipeline
          REDIS_URL: redis://default:@localhost:6379

  python:
    name: Python — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/python-media-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: workers/python-media-worker/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: python -m pytest tests/ -v
