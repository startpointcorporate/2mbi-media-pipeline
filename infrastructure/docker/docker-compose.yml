name: 2mbi-media-pipeline

services:
  postgres:
    image: postgres:16-alpine
    container_name: mpg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_pipeline
    ports: ["5432:5432"]
    volumes: [mpg_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d media_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mpg-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redispass"]
    ports: ["6379:6379"]
    volumes: [mpg_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mpg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [mpg_minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  media-pipeline-api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: mpg-api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/media_pipeline
      REDIS_URL: redis://:redispass@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      KEYCLOAK_URL: ""
      KEYCLOAK_REALM: ""
      KEYCLOAK_CLIENT_ID: ""
      KEYCLOAK_CLIENT_SECRET: ""
      DIRECTUS_URL: ""
      DIRECTUS_TOKEN: ""
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  editorial-orchestrator:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.orchestrator
    container_name: mpg-orchestrator
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/media_pipeline
      REDIS_URL: redis://:redispass@redis:6379
      MEDIA_API_URL: http://media-pipeline-api:3001
    depends_on:
      media-pipeline-api: { condition: service_started }

  python-media-worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.python-worker
    container_name: mpg-python-worker
    environment:
      REDIS_URL: redis://:redispass@redis:6379
      CONSUMER_GROUP: group:media-workers
      STREAM_TASKS: stream:media-tasks
      MEDIA_API_URL: http://media-pipeline-api:3001
      MEDIA_CAPABILITIES: ingestion,transcription,render-video,render-image
    depends_on:
      redis: { condition: service_healthy }

  typescript-editorial-worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.editorial-worker
    container_name: mpg-ts-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/media_pipeline
      REDIS_URL: redis://:redispass@redis:6379
      MEDIA_API_URL: http://media-pipeline-api:3001
      STREAM_TASKS: stream:editorial-tasks
    depends_on:
      redis: { condition: service_healthy }

volumes:
  mpg_postgres_data:
  mpg_redis_data:
  mpg_minio_data:
