[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-media-worker"
version = "0.1.0"
description = "Python Media Worker for 2mbi-media-pipeline"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "minio>=7.2",
    "faster-whisper>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/models.py" = ["N815"]

[tool.mypy]
strict = true
python_version = "3.12"
